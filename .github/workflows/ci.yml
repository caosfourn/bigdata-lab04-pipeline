name: Test pipeline and publish Jupyter Book

on:
  push:
    branches: [feat/complete-lab04-submission]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A Pages deployment must finish before the next one starts. Keeping the older
# run alive avoids cancelling a deployment after its artifact was uploaded.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java 17 for PySpark
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==8.3.5

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts run_demo.py

      - name: Run all tests
        run: python -m pytest -q

      - name: Validate Docker Compose
        run: docker compose --profile person3 config --quiet

      - name: Build Jupyter Book with warnings treated as errors
        run: jupyter-book build . --all --warningiserror

      # Publish only from the reviewed submission branch; pull requests remain test-only.
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/complete-lab04-submission'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/complete-lab04-submission'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/complete-lab04-submission'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
