<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Incremental CPG streaming architecture</title>
  <desc id="desc">A Python repository is discovered and parsed one file at a time. Four Kafka topics route nodes and edges to Neo4j, metadata through Spark to MongoDB, and errors to monitoring.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .box { stroke: #475569; stroke-width: 2; rx: 14; }
      .flow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>
  <rect width="1400" height="720" fill="#f8fafc"/>
  <text x="700" y="48" text-anchor="middle" class="title">Incremental Code Property Graph Streaming Pipeline</text>

  <rect x="35" y="280" width="180" height="105" class="box" fill="#dbeafe"/>
  <text x="125" y="318" text-anchor="middle" class="label">Python repo</text>
  <text x="125" y="345" text-anchor="middle" class="small">shallow clone</text>
  <text x="125" y="366" text-anchor="middle" class="small">file discovery</text>

  <rect x="270" y="265" width="205" height="135" class="box" fill="#e0e7ff"/>
  <text x="372" y="307" text-anchor="middle" class="label">Parser Service</text>
  <text x="372" y="335" text-anchor="middle" class="small">one file at a time</text>
  <text x="372" y="358" text-anchor="middle" class="small">AST · CFG · DFG · CALL</text>
  <text x="372" y="381" text-anchor="middle" class="small">stable IDs + schema v1</text>

  <path d="M215 332 H270" class="flow"/>

  <rect x="535" y="92" width="190" height="78" class="box" fill="#fef3c7"/>
  <text x="630" y="125" text-anchor="middle" class="label">cpg.nodes</text>
  <text x="630" y="150" text-anchor="middle" class="small">key: node_id</text>
  <rect x="535" y="205" width="190" height="78" class="box" fill="#fef3c7"/>
  <text x="630" y="238" text-anchor="middle" class="label">cpg.edges</text>
  <text x="630" y="263" text-anchor="middle" class="small">key: edge_id</text>
  <rect x="535" y="390" width="190" height="78" class="box" fill="#dcfce7"/>
  <text x="630" y="423" text-anchor="middle" class="label">cpg.metadata</text>
  <text x="630" y="448" text-anchor="middle" class="small">key: file_id</text>
  <rect x="535" y="550" width="190" height="78" class="box" fill="#fee2e2"/>
  <text x="630" y="583" text-anchor="middle" class="label">cpg.errors</text>
  <text x="630" y="608" text-anchor="middle" class="small">parser failures</text>

  <path d="M475 315 C500 315 505 131 535 131" class="flow"/>
  <path d="M475 325 C505 325 505 244 535 244" class="flow"/>
  <path d="M475 342 C505 342 505 429 535 429" class="flow"/>
  <path d="M475 355 C500 355 505 589 535 589" class="flow"/>

  <rect x="795" y="135" width="215" height="110" class="box" fill="#ede9fe"/>
  <text x="902" y="177" text-anchor="middle" class="label">Kafka Connect</text>
  <text x="902" y="204" text-anchor="middle" class="small">Neo4j Sink 5.5</text>
  <text x="902" y="226" text-anchor="middle" class="small">MERGE by stable ID</text>
  <path d="M725 131 H770 Q785 131 795 153" class="flow"/>
  <path d="M725 244 H770 Q785 244 795 223" class="flow"/>

  <rect x="1090" y="145" width="220" height="92" class="box" fill="#cffafe"/>
  <text x="1200" y="183" text-anchor="middle" class="label">Neo4j</text>
  <text x="1200" y="210" text-anchor="middle" class="small">CPGNode · CPG_EDGE</text>
  <path d="M1010 190 H1090" class="flow"/>

  <rect x="795" y="375" width="215" height="110" class="box" fill="#d1fae5"/>
  <text x="902" y="414" text-anchor="middle" class="label">Spark Streaming</text>
  <text x="902" y="442" text-anchor="middle" class="small">metadata schema</text>
  <text x="902" y="464" text-anchor="middle" class="small">replace/upsert</text>
  <path d="M725 429 H795" class="flow"/>

  <rect x="1090" y="375" width="220" height="92" class="box" fill="#ccfbf1"/>
  <text x="1200" y="413" text-anchor="middle" class="label">MongoDB</text>
  <text x="1200" y="440" text-anchor="middle" class="small">_id = file_id</text>
  <path d="M1010 421 H1090" class="flow"/>

  <rect x="795" y="520" width="215" height="84" class="box" fill="#f1f5f9"/>
  <text x="902" y="554" text-anchor="middle" class="label">Checkpoint</text>
  <text x="902" y="580" text-anchor="middle" class="small">durable Kafka offsets</text>
  <path d="M902 485 V520" class="flow dashed"/>

  <rect x="1090" y="548" width="220" height="82" class="box" fill="#ffe4e6"/>
  <text x="1200" y="582" text-anchor="middle" class="label">Monitoring</text>
  <text x="1200" y="608" text-anchor="middle" class="small">errors + connector DLQ</text>
  <path d="M725 589 H1090" class="flow"/>

  <text x="700" y="684" text-anchor="middle" class="small">Nodes/edges go directly to Neo4j. Spark is used only for metadata → MongoDB.</text>
</svg>
