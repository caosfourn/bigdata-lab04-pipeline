  <text x="620" y="158" class="head">END OFFSETS BY PARTITION</text>
  <text x="1120" y="158" class="head">POLICY</text>
  <line x1="70" y1="174" x2="1330" y2="174" class="rule"/>

  <text x="75" y="211" class="mono">cpg.nodes</text>
  <text x="470" y="211" class="mono">3</text>
  <text x="620" y="211" class="mono">0:219695 · 1:217952 · 2:218999</text>
  <text x="1120" y="211" class="mono">compact,delete</text>
  <text x="75" y="258" class="mono">cpg.edges</text>
  <text x="470" y="258" class="mono">3</text>
  <text x="620" y="258" class="mono">0:277086 · 1:277833 · 2:276927</text>
  <text x="1120" y="258" class="mono">compact,delete</text>
  <text x="75" y="305" class="mono">cpg.metadata</text>
  <text x="470" y="305" class="mono">3</text>
  <text x="620" y="305" class="mono">0:178 · 1:175 · 2:147</text>
  <text x="1120" y="305" class="mono">compact,delete</text>
  <text x="75" y="352" class="mono">cpg.errors</text>
  <text x="470" y="352" class="mono">1</text>
  <text x="620" y="352" class="mono">0:0</text>
  <text x="1120" y="352" class="mono">delete</text>
  <text x="75" y="386" class="sub">Operational DLQ: cpg.neo4j.dlq · partition 0 end offset = 0</text>

  <rect x="45" y="430" width="650" height="170" class="panel"/>
  <text x="75" y="470" class="head">Kafka Connect REST status</text>
  <text x="75" y="510" class="mono">connector  cpg-neo4j-sink</text>
  <text x="75" y="546" class="mono">connector state</text>
  <text x="285" y="546" class="ok">RUNNING</text>
