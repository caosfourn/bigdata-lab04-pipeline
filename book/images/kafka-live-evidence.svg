<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Live Kafka topics and Neo4j Sink evidence</title>
  <desc id="desc">Recorded 25 July 2026 from kafka-topics, kafka-get-offsets, Kafka Connect status, and kafka-consumer-groups. All connector lags are zero.</desc>
  <defs>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e8f0; }
      .sub { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94a3b8; }
      .head { font: 700 17px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #f8fafc; }
      .mono { font: 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #cbd5e1; }
      .ok { font: 700 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #4ade80; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 2; rx: 14; }
      .rule { stroke: #334155; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1400" height="650" fill="#020617"/>
  <text x="55" y="58" class="title">Kafka live verification</text>
  <text x="55" y="88" class="sub">Recorded from the running Docker stack · 2026-07-25 · no mocked values</text>

  <rect x="45" y="120" width="1310" height="285" class="panel"/>
  <text x="75" y="158" class="head">TOPIC</text>
