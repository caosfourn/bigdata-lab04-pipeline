  <text x="285" y="578" class="ok">RUNNING</text>

  <rect x="720" y="430" width="635" height="170" class="panel"/>
  <text x="750" y="470" class="head">Consumer group: connect-cpg-neo4j-sink</text>
  <text x="750" y="510" class="mono">cpg.nodes     3 / 3 partitions</text>
  <text x="1195" y="510" class="ok">LAG 0</text>
  <text x="750" y="546" class="mono">cpg.edges     3 / 3 partitions</text>
  <text x="1195" y="546" class="ok">LAG 0</text>
  <text x="750" y="582" class="mono">cpg.metadata  3 / 3 partitions</text>
