<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">MongoDB and Spark checkpoint live evidence</title>
  <desc id="desc">MongoDB contains 490 LeRobot metadata documents with 490 distinct file IDs, and Spark resumed from committed batch 124 at batch 125 without new offsets.</desc>
  <defs>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #052e16; }
      .sub { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .head { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #14532d; }
      .mono { font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #d1fae5; }
      .mono2 { font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #dbeafe; }
      .big { font: 700 34px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #166534; }
      .label { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .ok { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #15803d; }
    </style>
  </defs>
  <rect width="1400" height="650" fill="#f8fafc"/>
  <text x="55" y="58" class="title">Spark Structured Streaming → MongoDB</text>
  <text x="55" y="88" class="sub">Live collection and checkpoint state recorded after replay + restart · 2026-07-25</text>

  <rect x="45" y="120" width="610" height="445" rx="14" fill="#052e16" stroke="#166534" stroke-width="2"/>
  <text x="75" y="160" class="mono">db.metadata.aggregate(...)</text>
  <text x="75" y="198" class="mono">{</text>
  <text x="100" y="232" class="mono">repo_id: "huggingface/lerobot",</text>
  <text x="100" y="266" class="mono">documents: 490,</text>
  <text x="100" y="300" class="mono">distinct_file_ids: 490,</text>
  <text x="100" y="334" class="mono">duplicate_groups: [],</text>
  <text x="100" y="368" class="mono">collection_total: 493</text>
  <text x="75" y="402" class="mono">}</text>
  <text x="75" y="452" class="mono">target _id == stable file_id</text>
  <text x="75" y="486" class="mono">operationType = replace</text>
  <text x="75" y="520" class="mono">upsertDocument = true</text>

  <rect x="690" y="120" width="665" height="445" rx="14" fill="#172554" stroke="#1d4ed8" stroke-width="2"/>
  <text x="720" y="160" class="mono2">Spark restart log</text>
  <text x="720" y="205" class="mono2">latest committed batch: 124</text>
  <text x="720" y="242" class="mono2">Resuming at batch 125</text>
  <text x="720" y="279" class="mono2">committed offsets:</text>
  <text x="750" y="313" class="mono2">cpg.metadata {0:178, 1:175, 2:147}</text>
  <text x="720" y="350" class="mono2">available offsets:</text>
  <text x="750" y="384" class="mono2">cpg.metadata {0:178, 1:175, 2:147}</text>
  <text x="720" y="421" class="mono2">pending batches: []</text>
  <text x="720" y="458" class="mono2">committed offset total: 500</text>
  <text x="720" y="512" class="mono2">Streaming query idle; no replayed batch</text>

  <text x="350" y="610" text-anchor="middle" class="ok">490 documents = 490 stable IDs</text>
  <text x="1020" y="610" text-anchor="middle" class="ok">restart preserved batch 124 and all offsets</text>
</svg>
